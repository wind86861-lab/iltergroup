# /etc/nginx/sites-available/iltergroup (symlinked into sites-enabled).
# Installed by deploy/deploy.sh; the certificate lines were written by certbot.

server {
    server_name iltergroup.uz www.iltergroup.uz;
    root /opt/iltergroup/app/dist;
    index index.html;

    # Product images (10 MB) and the catalogue PDF (20 MB) go through here.
    client_max_body_size 25M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html must not be cached, or browsers keep loading old asset names.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /opt/iltergroup/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/iltergroup.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iltergroup.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.iltergroup.uz) {
        return 301 https://$host$request_uri;
    }
    if ($host = iltergroup.uz) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name iltergroup.uz www.iltergroup.uz;
    return 404;
}
